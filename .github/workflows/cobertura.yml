name: Gil e Dona Cida — calendário do Flamengo
on:
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch:
    inputs:
      ensaio:
        description: Gerar sem publicar
        type: boolean
        default: true
  workflow_call:
    inputs:
      ensaio:
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: video-pos-jogo
  cancel-in-progress: false
jobs:
  cobertura:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconciliar publicações inconclusivas
        if: vars.PUBLICAR == 'true' && inputs.ensaio != true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m src.flamengo.reconciliar
      - name: Instalar leitor de notícias
        run: python -m pip install -q -r requirements-noticias.txt
      - name: Selecionar pauta e pesquisar notícias
        id: pauta
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          python -m src.flamengo.programacao --out data/pauta_cobertura.json
          cod=$?
          set -e
          if [ "$cod" -eq 3 ]; then
            echo 'tem=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$cod" -eq 0 ] || exit "$cod"
          echo 'tem=true' >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          p=json.load(open('data/pauta_cobertura.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('tipo='+('card' if p['formato']=='tabela_card' else 'video')+'\n')
          PY
      - name: Dependências
        if: steps.pauta.outputs.tem == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango1.0-dev libcairo2-dev ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -q -r requirements.txt
      - uses: ./.github/actions/setup-hyperframes
        if: steps.pauta.outputs.tipo == 'video'
      - uses: actions/cache@v4
        if: steps.pauta.outputs.tipo == 'video'
        with:
          path: ~/.cache/flamengo_vozes
          key: flamengo-gil-cida-${{ runner.os }}-${{ github.run_id }}
          restore-keys: flamengo-gil-cida-${{ runner.os }}-
      - name: Gerar Reel
        if: steps.pauta.outputs.tipo == 'video'
        env:
          FLAMENGO_MOTOR: v3
        run: python -m src.flamengo.gerar --formato diario --pauta data/pauta_cobertura.json --out saida/conteudo.mp4
      - name: Gerar card
        if: steps.pauta.outputs.tipo == 'card'
        run: python -m src.flamengo.render.tabela_card --pauta data/pauta_cobertura.json --out saida/conteudo.jpg
      - uses: actions/upload-artifact@v4
        if: steps.pauta.outputs.tem == 'true'
        with:
          name: gil-cida-${{ github.run_id }}
          path: |
            saida/conteudo.*
            data/pauta_cobertura.json
          retention-days: 30
      - name: Publicar no horário e confirmar recibo
        if: steps.pauta.outputs.tem == 'true' && vars.PUBLICAR == 'true' && inputs.ensaio != true
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECTED_IG_USERNAME: mengaodasala
          TIPO: ${{ steps.pauta.outputs.tipo }}
        run: |
          python -m src.flamengo.programacao --validar-envio data/pauta_cobertura.json
          python -m src.flamengo.publicar --so-verificar
          TAG="cobertura-${{ github.run_id }}-${{ github.run_attempt }}"
          if [ "$TIPO" = card ]; then
            gh release create "$TAG" saida/conteudo.jpg --title "$TAG" --notes 'Tabela do Brasileirão'
            python -m src.flamengo.publicar --image --video-url "https://github.com/${{ github.repository }}/releases/download/$TAG/conteudo.jpg" --legenda saida/conteudo.txt
          else
            gh release create "$TAG" saida/conteudo.mp4 --title "$TAG" --notes 'Gil e Dona Cida'
            python -m src.flamengo.publicar --video-url "https://github.com/${{ github.repository }}/releases/download/$TAG/conteudo.mp4" --legenda saida/conteudo.txt
          fi
      - name: Preservar recibos mesmo em falha
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/publicacoes.json
          git diff --cached --quiet || git commit -m 'Registra publicação Gil/Cida'
          git pull --rebase -q && git push
      - name: Aviso de falha
        if: failure()
        run: |
          echo '::error::Publicação não confirmada. Nova tentativa na próxima execução; consulte o recibo e as notificações de falha do GitHub Actions.'
          echo 'Falha na cobertura Gil/Cida. Não confundir artefato gerado com publicação.' >> "$GITHUB_STEP_SUMMARY"
