name: Cobertura completa do Flamengo

# Pré/pós de todas as partidas da agenda agregada e tabela toda segunda às 19h BRT.
# Recibos por partida e semana; uma pendência processada em cada execução.
# PUBLICA SOMENTE se a variavel do repositorio PUBLICAR=true. Sem ela: modo ensaio.

on:
  schedule:
    - cron: "11,31,51 * * * *" # fila independente; pré/pós por jogo e tabela semanal
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Gerar sem publicar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: video-pos-jogo          # mesma fila do pos-jogo: os dois fazem commit
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pauta do dia
        id: pauta
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # esquete do primo com dado real do dia
        run: |
          set +e
          python -m src.flamengo.cobertura --out data/pauta_cobertura.json
          cod=$?
          set -e
          if [ $cod -eq 3 ]; then
            echo "tem=false" >> "$GITHUB_OUTPUT"
            echo "- Sem cobertura nova: partidas/semana já cobertas ou fora da janela." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ $cod -ne 0 ] && exit $cod
          echo "tem=true" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Dependencias de render
        if: steps.pauta.outputs.tem == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango1.0-dev libcairo2-dev ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -q -U pip setuptools wheel
          python -m pip install -q -r requirements.txt
          # fonte da colagem (etiquetas, legenda, carimbo) — a mesma do @previsaorj
          mkdir -p ~/.local/share/fonts/poppins
          for f in Poppins-Bold.ttf Poppins-Regular.ttf; do
            curl -fsSL --retry 3 -o ~/.local/share/fonts/poppins/$f https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/$f
          done
          fc-cache -f >/dev/null

      - name: Preparar HyperFrames
        if: steps.pauta.outputs.tem == 'true'
        uses: ./.github/actions/setup-hyperframes

      - name: Cache das vozes da dupla
        if: steps.pauta.outputs.tem == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/flamengo_vozes
          key: flamengo-edge-${{ runner.os }}-${{ github.run_id }}
          restore-keys: flamengo-edge-${{ runner.os }}-

      - name: Cache do modelo de voz
        if: steps.pauta.outputs.tem == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/flamengo_kokoro
          key: kokoro-v1

      - name: Gerar vídeo com HyperFrames e vozes da dupla
        if: steps.pauta.outputs.tem == 'true'
        run: |
          mkdir -p saida
          python -m src.flamengo.gerar --formato diario --pauta data/pauta_cobertura.json \
            --out saida/cobertura_${{ steps.pauta.outputs.tag }}.mp4
          echo "----- LEGENDA -----"
          cat saida/cobertura_${{ steps.pauta.outputs.tag }}.txt

      - name: Gerar cards de Stories
        if: steps.pauta.outputs.tem == 'true'
        run: python -m src.flamengo.stories --pauta data/pauta_cobertura.json

      - name: Guardar video e legenda
        if: steps.pauta.outputs.tem == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-cobertura-${{ steps.pauta.outputs.tag }}
          path: |
            saida/*.mp4
            saida/*.txt
            saida/*.json
            saida/stories/*
            data/pauta_cobertura.json
          retention-days: 30

      - name: Publicar no Instagram
        id: publicar
        if: steps.pauta.outputs.tem == 'true' && vars.PUBLICAR == 'true' && inputs.ensaio != true
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECTED_IG_USERNAME: mengaodasala
        run: |
          set -euo pipefail
          T=${{ steps.pauta.outputs.tag }}
          python -m src.flamengo.publicar --so-verificar
          TAG="cobertura-$T"
          cp "saida/cobertura_$T.mp4" REEL.mp4
          gh release create "$TAG" REEL.mp4 saida/stories/story_do_dia.png --title "$TAG" --notes "Cobertura @mengaodasala"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/REEL.mp4"
          python -m src.flamengo.publicar --video-url "$URL" --legenda "saida/cobertura_$T.txt"
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r R; do
            gh release delete "$R" --cleanup-tag --yes || true
          done

      - name: Publicar Story com convite para a resenha
        if: steps.pauta.outputs.tem == 'true' && vars.PUBLICAR == 'true' && inputs.ensaio != true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECTED_IG_USERNAME: mengaodasala
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/cobertura-${{ steps.pauta.outputs.tag }}/story_do_dia.png"
          python -m src.flamengo.publicar --story --video-url "$URL" --legenda saida/stories/story_do_dia.txt

      - name: Preservar recibo inclusive em falha
        if: always()
        run: |
          if [ -f data/publicacoes.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publicacoes.json
            git diff --cached --quiet || git commit -m "Atualiza recibos de publicação"
            git pull --rebase -q && git push
          fi

      - name: Resumo da execução
        if: always()
        env:
          RESULTADO: ${{ job.status }}
          PUBLICACAO: ${{ steps.publicar.outcome }}
          TEM_PAUTA: ${{ steps.pauta.outputs.tem }}
        run: |
          echo "- Resultado: $RESULTADO; pauta: $TEM_PAUTA; publicação: $PUBLICACAO." >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULTADO" = "failure" ]; then
            echo "::error::Falha na cobertura. Consulte a etapa vermelha; vídeo gerado não significa publicado."
          fi
