name: Gil e Dona Cida — calendário do Flamengo
on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: Gerar sem publicar
        type: boolean
        default: true
  workflow_call:
    inputs:
      ensaio:
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: video-pos-jogo
  cancel-in-progress: false
jobs:
  cobertura:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconciliar publicações inconclusivas
        if: vars.PUBLICAR == 'true' && inputs.ensaio != true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m src.flamengo.reconciliar
      - name: Perguntas diárias nos Stories
        id: stories
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECTED_IG_USERNAME: mengaodasala
          PUBLICAR: ${{ vars.PUBLICAR }}
          ENSAIO: ${{ inputs.ensaio }}
        run: |
          python -m pip install -q pillow
          if [ "$PUBLICAR" = true ] && [ "$ENSAIO" != true ]; then
            python -m src.flamengo.stories_respostas
          else
            python -m src.flamengo.stories_respostas --ensaio
          fi
      - name: Avisar falha dos Stories sem bloquear o Reel
        if: steps.stories.outcome == 'failure'
        run: |
          echo '::warning::Story não confirmado. Será tentado novamente; consulte os recibos.'
          echo 'Story não confirmado: conferir etapa de perguntas e recibos.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stories-respostas-${{ github.run_id }}
          path: saida/stories_respostas/
          if-no-files-found: ignore
          retention-days: 14
      - name: Instalar leitor de notícias
        run: python -m pip install -q -r requirements-noticias.txt
      - name: Selecionar pauta e pesquisar notícias
        id: pauta
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          python -m src.flamengo.programacao --out data/pauta_cobertura.json
          cod=$?
          set -e
          if [ "$cod" -eq 3 ]; then
            echo 'tem=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$cod" -eq 0 ] || exit "$cod"
          echo 'tem=true' >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          p=json.load(open('data/pauta_cobertura.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('tipo='+('card' if p['formato']=='tabela_card' else 'video')+'\n')
          PY
      - name: Dependências
        if: steps.pauta.outputs.tem == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -q kokoro-onnx soundfile numpy edge-tts pillow
      - uses: ./.github/actions/setup-hyperframes
        if: steps.pauta.outputs.tem == 'true'
      - uses: actions/cache@v4
        if: steps.pauta.outputs.tipo == 'video'
        with:
          path: |
            ~/.cache/flamengo_vozes
            ~/.cache/flamengo_kokoro
          key: flamengo-gil-cida-${{ runner.os }}-${{ github.run_id }}
          restore-keys: flamengo-gil-cida-${{ runner.os }}-
      - name: Gerar Reel
        if: steps.pauta.outputs.tipo == 'video'
        env:
          FLAMENGO_MOTOR: v3
        run: python -m src.flamengo.gerar --formato diario --pauta data/pauta_cobertura.json --out saida/conteudo.mp4
      - name: Gerar Reel de tabela
        if: steps.pauta.outputs.tipo == 'card'
        run: python -m src.flamengo.render.tabela_reel --pauta data/pauta_cobertura.json --out saida/conteudo.mp4
      - name: Gerar capa
        if: steps.pauta.outputs.tem == 'true'
        run: python -m src.flamengo.render.capa data/pauta_cobertura.json saida/capa.jpg
      - uses: actions/upload-artifact@v4
        if: steps.pauta.outputs.tem == 'true'
        with:
          name: gil-cida-${{ github.run_id }}
          path: |
            saida/conteudo.*
            saida/capa.jpg
            data/pauta_cobertura.json
          retention-days: 30
      - name: Publicar no horário e confirmar recibo
        if: steps.pauta.outputs.tem == 'true' && vars.PUBLICAR == 'true' && inputs.ensaio != true
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECTED_IG_USERNAME: mengaodasala
        run: |
          python -m src.flamengo.programacao --validar-envio data/pauta_cobertura.json
          python -m src.flamengo.publicar --so-verificar
          TAG="cobertura-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$TAG" saida/conteudo.mp4 saida/capa.jpg --title "$TAG" --notes 'Mengão da Sala'
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python -m src.flamengo.publicar --video-url "$BASE/conteudo.mp4" --cover-url "$BASE/capa.jpg" --legenda saida/conteudo.txt
      - name: Preservar recibos mesmo em falha
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/publicacoes.json
          git diff --cached --quiet || git commit -m 'Registra publicação Gil/Cida'
          git pull --rebase -q && git push
      - name: Aviso de falha
        if: failure()
        run: |
          echo '::error::Publicação não confirmada. Nova tentativa na próxima execução; consulte o recibo e as notificações de falha do GitHub Actions.'
          echo 'Falha na cobertura Gil/Cida. Não confundir artefato gerado com publicação.' >> "$GITHUB_STEP_SUMMARY"
