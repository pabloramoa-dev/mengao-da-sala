name: Video pos-jogo

# Gera o Reel e a legenda depois de cada jogo e guarda como artefato.
# PUBLICA no @mengaodasala SOMENTE se a variavel do repositorio PUBLICAR=true
# (Settings > Secrets and variables > Actions > Variables). Sem ela: modo ensaio.
# A cada 3 horas: coleta (ESPN + Cartola + noticias + Groq checada), tabela,
# e so renderiza se o ultimo jogo encerrado ainda nao tiver video.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Gerar sem publicar"
        type: boolean
        default: true
      forcar:
        description: "Gerar mesmo se o jogo ja tiver video"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: video-pos-jogo
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sondagem de partida recente
        id: janela
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ativo=true" >> "$GITHUB_OUTPUT"
          else
            python -m src.flamengo.janela
          fi

      - name: Coletar e analisar
        if: steps.janela.outputs.ativo == 'true' 
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/flamengo/coletor/pos_jogo.py
          python src/flamengo/coletor/tabela.py data/analise.json

      - name: Tem jogo novo?
        if: steps.janela.outputs.ativo == 'true'
        id: novo
        env:
          FORCAR: ${{ inputs.forcar }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          a = json.load(open("data/analise.json"))
          jogo = a.get("jogo") or {}
          ult = pathlib.Path("data/ultimo_video.json")
          feito = json.loads(ult.read_text()).get("id") if ult.exists() else None
          novo = bool(jogo.get("id")) and (jogo.get("id") != feito or os.environ.get("FORCAR") == "true")
          print(f"jogo {jogo.get('id')} ({jogo.get('nome')}) | ultimo video {feito} | novo={novo}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"novo={'true' if novo else 'false'}\n")
              f.write(f"id={jogo.get('id', 'x')}\n")
          PY

      - name: Dependencias de render
        if: steps.novo.outputs.novo == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango1.0-dev libcairo2-dev ffmpeg espeak-ng
          python -m pip install -q -U pip setuptools wheel
          python -m pip install -q -r requirements.txt

      - name: Cache do modelo de voz
        if: steps.novo.outputs.novo == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/flamengo_kokoro
          key: kokoro-v1

      - name: Gerar video (voz do Bira)
        if: steps.novo.outputs.novo == 'true'
        run: |
          mkdir -p saida
          python -m src.flamengo.gerar --analise data/analise.json --formato pos_jogo_v2 \
            --out saida/pos_jogo_${{ steps.novo.outputs.id }}.mp4
          echo "----- LEGENDA -----"
          cat saida/pos_jogo_${{ steps.novo.outputs.id }}.txt

      - name: Guardar video e legenda
        if: steps.novo.outputs.novo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-pos-jogo-${{ steps.novo.outputs.id }}
          path: |
            saida/*.mp4
            saida/*.txt
            saida/*.json
            data/analise.json
          retention-days: 30

      - name: Publicar no Instagram
        if: steps.novo.outputs.novo == 'true' && vars.PUBLICAR == 'true' && inputs.ensaio != true
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECTED_IG_USERNAME: mengaodasala
        run: |
          set -euo pipefail
          ID=${{ steps.novo.outputs.id }}
          python -m src.flamengo.publicar --so-verificar
          TAG="reel-$ID-$(date -u +%Y%m%d%H%M)"
          cp "saida/pos_jogo_$ID.mp4" REEL.mp4
          gh release create "$TAG" REEL.mp4 --title "$TAG" --notes "Reel pos-jogo @mengaodasala"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/REEL.mp4"
          python -m src.flamengo.publicar --video-url "$URL" --legenda "saida/pos_jogo_$ID.txt"
          # guarda so os 10 releases mais recentes
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r T; do
            gh release delete "$T" --cleanup-tag --yes || true
          done

      - name: Marcar jogo como publicado
        if: steps.novo.outputs.novo == 'true' && vars.PUBLICAR == 'true' && inputs.ensaio != true
        run: |
          python - <<'PY'
          import json
          a = json.load(open("data/analise.json"))
          j = a["jogo"]
          json.dump({"id": j["id"], "nome": j.get("nome"), "data": j.get("data"),
                     "resultado": j.get("resultado")},
                    open("data/ultimo_video.json", "w"), ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ultimo_video.json data/publicacoes.json
          git commit -m "Video pos-jogo gerado: ${{ steps.novo.outputs.id }}" || echo "nada a commitar"
          git pull --rebase -q && git push

      - name: Preservar recibo inclusive em falha
        if: always()
        run: |
          if [ -f data/publicacoes.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publicacoes.json
            git diff --cached --quiet || git commit -m "Atualiza recibos de publicação"
            git pull --rebase -q && git push
          fi
