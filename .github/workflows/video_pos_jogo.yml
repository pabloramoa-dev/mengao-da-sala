name: Pós-jogo — calendário Gil e Cida
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      ensaio:
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  cobertura:
    uses: ./.github/workflows/cobertura.yml
    with:
      ensaio: ${{ github.event_name == 'workflow_dispatch' && inputs.ensaio }}
    secrets: inherit
