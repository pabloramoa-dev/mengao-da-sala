name: Teste fontes plano B

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rodar teste
        run: python src/flamengo/coletor/fontes_teste.py
      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fontes-teste
          path: data/fontes_teste.json
          if-no-files-found: ignore
