name: Promo crossover — Gil e Dona Cida

on:
  push:
    paths:
      - "tools/promo_crossover_trigger_20261006.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango1.0-dev libcairo2-dev ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -q -r requirements.txt
      - uses: ./.github/actions/setup-hyperframes
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flamengo_kokoro
          key: kokoro-v1
      - name: Renderizar conversa promocional
        run: python -m tools.promo_crossover
      - name: Entregar MP4
        uses: actions/upload-artifact@v4
        with:
          name: promo-crossover-gil-cida
          path: |
            promo_crossover_out/*.mp4
            promo_crossover_out/work/audio/*.json
          retention-days: 2
