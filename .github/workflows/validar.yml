name: Validar evolucao editorial
on:
  push:
    paths: ['src/**', 'tests/**', 'config/**', 'video/**', '.github/**', 'requirements*.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest numpy pillow -r requirements-noticias.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src
  render:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango1.0-dev libcairo2-dev ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -q -r requirements.txt
      - uses: ./.github/actions/setup-hyperframes
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flamengo_kokoro
          key: kokoro-v1
      - name: Gerar amostras Gil e Cida sem publicar
        run: |
          python -m tools.teste_gil_cida
          for quadro in pre palpite pos; do
            python -m src.flamengo.gerar --formato diario --pauta "saida/${quadro}_pauta.json" --out "saida/${quadro}_teste.mp4"
            ffmpeg -y -ss 2 -i "saida/${quadro}_teste.mp4" -frames:v 1 "saida/${quadro}_frame.png"
          done
          python -m src.flamengo.render.tabela_card --pauta saida/tabela_pauta.json --out saida/tabela_teste.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: amostra-hyperframes-producao
          path: |
            saida/*.mp4
            saida/*.json
            saida/*.txt
            saida/*.png
            saida/*.jpg
            saida/stories/*.png
          retention-days: 30

  integracao_leitura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar destino e permissões existentes sem publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EXPECTED_IG_USERNAME: mengaodasala
        run: |
          python -m src.flamengo.publicar --so-verificar
          python -m src.flamengo.comunidade
          python -m src.flamengo.relatorio
          python -m src.flamengo.proteger_metricas
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-integracao
          path: |
            data/metricas_privadas.cms
            data/comunidade.json

  pesquisa_atual:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q -r requirements-noticias.txt
      - name: Consultar notícias e estatísticas sem publicar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m tools.diagnostico_pesquisa
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pesquisa-editorial
          path: saida/diagnostico_pesquisa.json
          retention-days: 14
