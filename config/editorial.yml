# Calendário ativo: programacao.py + config/programacao.json.
versao: 5
elenco: [Gil, Dona Cida]
timezone: America/Sao_Paulo
formatos:
  pre_jogo: {apresentador: Gil, quando: dia civil anterior, hora: '19:00'}
  palpite_cida: {apresentador: Dona Cida, quando: dia da partida antes do início, hora: '09:00'}
  pos_jogo_v2: {apresentador: Gil, quando: dia civil seguinte com resultado confirmado, hora: '12:00'}
  tabela_card: {quando: dia sem pré/palpite/pós, hora: '19:00', fonte: ESPN, equipes: 20}
regras:
  - Nunca publicar pré-jogo atrasado no dia da partida.
  - Não publicar palpite depois de a partida começar.
  - Palpite é opinião, sem promessa de acerto ou incentivo a apostas.
  - Confirmar status e horário novamente imediatamente antes do envio.
  - Notícias sem data, futuras ou vencidas são descartadas.
  - Rumor, provável escalação e dúvida não são confirmação.
  - Informação ausente não pode ser preenchida por invenção.
  - Registrar palpite publicado para comparação no pós-jogo.
  - Juninho e Primo não fazem parte da programação ativa.
